<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景/底层质感渐变 -->
    <linearGradient id="folioFolderGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- 主卡片渐变 (微光纸张感) -->
    <linearGradient id="docSurfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- 高亮活力渐变 (折角、核心元素) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 柔和下沉阴影 -->
    <filter id="softShadow" x="-15%" y="-15%" width="135%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- 折角投影 -->
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-3" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 1. 底层：Folio 文件夹背夹轮廓 -->
  <path d="M 88 152 
           C 88 128, 104 116, 128 116 
           L 204 116 
           C 220 116, 234 126, 244 140 
           L 262 166 
           C 270 178, 282 184, 296 184 
           L 384 184 
           C 408 184, 424 200, 424 224 
           L 424 388 
           C 424 416, 404 436, 376 436 
           L 136 436 
           C 108 436, 88 416, 88 388 
           Z" 
        fill="url(#folioFolderGrad)" opacity="0.92" />

  <!-- 2. 主体：悬浮简历卡片 (带投影) -->
  <g filter="url(#softShadow)">
    <!-- 卡片裁切路径：右上角切出 74px 的平滑折角 -->
    <path d="M 148 108 
             C 134 108, 124 118, 124 132 
             L 124 412 
             C 124 426, 134 436, 148 436 
             L 364 436 
             C 378 436, 388 426, 388 412 
             L 388 182 
             L 314 108 
             Z" 
          fill="url(#docSurfaceGrad)" 
          stroke="#E2E8F0" 
          stroke-width="1.5" />

    <!-- 右上角折页三角与投影 -->
    <path d="M 314 108 
             L 314 164 
             C 314 174, 322 182, 332 182 
             L 388 182 
             Z" 
          fill="url(#accentGrad)" 
          filter="url(#foldShadow)" />
  </g>

  <!-- 3. 卡片细节：个人档案/简历元素 -->
  <!-- 个人标识：头像/徽章剪影 -->
  <circle cx="188" cy="180" r="22" fill="#0284C7" fill-opacity="0.12" />
  <circle cx="188" cy="174" r="9" fill="#0284C7" />
  <path d="M 172 196 C 172 187, 179 184, 188 184 C 197 184, 204 187, 204 196 Z" fill="#0284C7" />

  <!-- 简历主标题骨架线 (带渐变主色) -->
  <rect x="226" y="166" width="68" height="12" rx="6" fill="#0F172A" />
  <rect x="226" y="186" width="46" height="7" rx="3.5" fill="#94A3B8" />

  <!-- 分割线 -->
  <line x1="162" y1="228" x2="350" y2="228" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />

  <!-- 经历/技能模块骨架线条 -->
  <!-- Block 1 -->
  <rect x="162" y="254" width="76" height="9" rx="4.5" fill="#3B82F6" />
  <rect x="162" y="273" width="188" height="7" rx="3.5" fill="#CBD5E1" />
  <rect x="162" y="290" width="154" height="7" rx="3.5" fill="#E2E8F0" />

  <!-- Block 2 -->
  <rect x="162" y="324" width="60" height="9" rx="4.5" fill="#3B82F6" />
  <rect x="162" y="343" width="188" height="7" rx="3.5" fill="#CBD5E1" />
  <rect x="162" y="360" width="138" height="7" rx="3.5" fill="#E2E8F0" />

  <!-- 4. 视觉点睛：右下角完成度/专业印记小星芒 (象征打磨出色的作品) -->
  <g transform="translate(352, 396) scale(0.9)">
    <path d="M 0 -14 
             C 1 -4, 4 -1, 14 0 
             C 4 1, 1 4, 0 14 
             C -1 4, -4 1, -14 0 
             C -4 -1, -1 -4, 0 -14 Z" 
          fill="url(#accentGrad)" />
  </g>
</svg>
