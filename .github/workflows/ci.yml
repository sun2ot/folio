name: Quality and Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate version and prepare release notes
        id: version
        run: node --experimental-strip-types scripts/release.ts --notes > release-notes.md
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm check:tests
      - name: Cache public repository cards for offline use
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: pnpm snapshot:github
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Archive corresponding source including the build's offline snapshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: git ls-files -z | tar --null --files-from=- -czf folio-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: folio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: folio-source
          path: |
            folio-source.tar.gz
            release-notes.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: folio-dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: folio-source
          path: .
      - name: Package static site
        run: |
          (cd dist && zip -r ../folio-dist.zip .)
          tar -czf folio-dist.tar.gz -C dist .
          sha256sum folio-dist.zip folio-dist.tar.gz folio-source.tar.gz > SHA256SUMS
      - name: Publish release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump package.json and add a changelog entry to publish a new version."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG points to another commit; choose a new version instead of moving the tag."
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" folio-dist.zip folio-dist.tar.gz folio-source.tar.gz SHA256SUMS \
            --verify-tag --target "$GITHUB_SHA" --title "Folio $TAG" --notes-file release-notes.md --latest
